name: Verify Kova Live Accounts
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kova-live-account-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KOVA_API: https://br-autumn-water-bc3ti0gm-kovaapi.compute.c-16.us-east-1.aws.neon.tech
    steps:
      - name: Health, database, registration, login and logout
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          const base = process.env.KOVA_API;
          async function api(path, method='GET', body, bearer) {
            const response = await fetch(base + path, {
              method, headers: {...(body ? {'content-type':'application/json'} : {}),...(bearer?{'authorization':'Bearer '+bearer}:{})},
              body: body ? JSON.stringify(body) : undefined, redirect:'manual'
            });
            const data = await response.json().catch(()=>({}));
            return {status:response.status, json:data};
          }
          const health=await api('/api/health');
          console.log('API status:',health.status,health.json?.data?.service||'');
          if(health.status!==200 || health.json?.data?.status!=='ok')process.exit(1);
          const database=await api('/api/health/db');
          console.log('Database status:',database.status,database.json?.data?.status||'');
          if(database.status!==200 || database.json?.data?.status!=='connected')process.exit(1);
          const handle='kova_smoke_'+randomBytes(4).toString('hex');
          const password=randomBytes(22).toString('hex');
          const registration=await api('/api/auth/register','POST',{handle,display_name:'Smoke Tester',password,birth_date:'2000-01-01'});
          console.log('Registration status:',registration.status,registration.json?.error||'ok');
          if(registration.status!==201 || !registration.json?.data?.token || registration.json?.data?.user?.handle!==handle)process.exit(1);
          const token=registration.json.data.token;
          const me=await api('/api/auth/me','GET',null,token);
          console.log('Authenticated profile:',me.status,me.json?.data?.handle===handle);
          if(me.status!==200||me.json?.data?.handle!==handle)process.exit(1);
          const logout=await api('/api/auth/logout','POST',null,token);
          console.log('Logout:',logout.status);
          if(logout.status!==200)process.exit(1);
          const expired=await api('/api/auth/me','GET',null,token);
          if(expired.status!==401)process.exit(1);
          const login=await api('/api/auth/login','POST',{handle,password});
          console.log('Login:',login.status,login.json?.error||'ok');
          if(login.status!==200||!login.json?.data?.token)process.exit(1);
          const afterLogin=await api('/api/auth/me','GET',null,login.json.data.token);
          if(afterLogin.status!==200||afterLogin.json?.data?.handle!==handle)process.exit(1);
          console.log('SUCCESS: registration, login, profile, database and logout roundtrip verified');
          JS
