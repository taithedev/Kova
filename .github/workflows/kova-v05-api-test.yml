name: Verify Kova 0.5 API and Privacy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kova-v05-api-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify healthy API and protected personal data
        env:
          KOVA_API: https://br-autumn-water-bc3ti0gm-kovaapi.compute.c-16.us-east-1.aws.neon.tech
        run: |
          node --input-type=module <<'JS'
          const base=process.env.KOVA_API;
          async function call(path,expected,method='GET',body=null){
            const response=await fetch(base+path,{method,redirect:'manual',
             headers:body?{'content-type':'application/json'}:{},
             body:body?JSON.stringify(body):undefined});
            const payload=await response.json().catch(()=>({}));
            console.log(method,path,response.status);
            if(response.status!==expected)throw Error('Failed '+path+' expected '+expected+' got '+response.status);
            return payload.data;
          }
          const health=await call('/api/health',200);
          if(health.version!=='0.5.0')throw Error('Backend version is stale');
          await call('/api/health/db',200);
          await call('/api/account/contact',401);
          await call('/api/account/contact',401,'PATCH',{email:'example@example.com'});
          await call('/api/profile/media/mine',401);
          await call('/api/profile/media/upload-url',401,'POST',{kind:'avatar',mime:'image/jpeg'});
          await call('/api/support/tickets',401);
          await call('/api/support/tickets',401,'POST',{subject:'Test',message:'Test message',category:'technical'});
          await call('/api/staff/tickets',401);
          await call('/api/staff/media',401);
          await call('/api/owner/overview',401);
          await call('/api/owner/overview',404,'POST');
          console.log('PASS: v0.5 health, database and all protected routes reject unauthenticated access');
          JS
